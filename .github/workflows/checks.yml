name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:verify
      - run: python3 tools/smoke-production.py --dist .next-verify
      - run: npm audit --omit=dev --audit-level=high
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.58.0
      - run: cfn-lint infra/foundation.yaml infra/service.yaml infra/ci.yaml
      - run: python -m py_compile tools/deploy.py tools/ci_release.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
  deploy:
    name: Deploy main to ECS
    needs: [application, infrastructure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: internal-specs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assume the main-branch deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::012619468172:role/internal-specs-github-deploy
          role-session-name: internal-specs-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-west-2
          allowed-account-ids: '012619468172'
          role-duration-seconds: 3600
      - name: Publish, scan, deploy, and verify
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_PAGER: ''
        run: python3 tools/ci_release.py
