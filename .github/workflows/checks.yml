name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Cancel obsolete PR checks; never cancel a main deployment during rollout.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:verify
      - run: python3 tools/smoke-production.py --dist .next-verify
      - run: npm audit --omit=dev --audit-level=high
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.58.0
      - run: cfn-lint infra/foundation.yaml infra/service.yaml infra/ci.yaml
      - run: python -m py_compile tools/deploy.py tools/ci_release.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
  gate:
    name: PR gate
    needs: [application, infrastructure]
    # A skipped/failed dependency must fail this required check, not skip it.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every validation job to succeed
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$INFRASTRUCTURE_RESULT" = success
  deploy:
    name: Deploy main to ECS
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: internal-specs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assume the main-branch deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::012619468172:role/internal-specs-github-deploy
          role-session-name: internal-specs-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-west-2
          allowed-account-ids: '012619468172'
          role-duration-seconds: 3600
      - name: Publish, scan, deploy, and verify
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_PAGER: ''
        run: python3 tools/ci_release.py
