name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:verify
      - run: python3 tools/smoke-production.py --dist .next-verify
      - run: npm audit --omit=dev --audit-level=high
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.58.0
      - run: cfn-lint infra/foundation.yaml infra/service.yaml
      - run: python -m py_compile tools/deploy.py
      - run: python tools/test_deploy.py
