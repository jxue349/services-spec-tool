AWSTemplateFormatVersion: '2010-09-09'
Description: Internal Specs foundation in the existing shared VPC
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-07faa997b84444780
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-0a51f4bb0e2f2638d,subnet-0986aff5d00b4a2a8
  CertificateArn:
    Type: String
    Description: Existing ACM certificate
    Default: arn:aws:acm:us-west-2:012619468172:certificate/e61b355c-c98b-4783-ba8d-272d30ae84b9
  OwnerEmail:
    Type: String
    Description: Individual service owner
    Default: cxu@wyze.com
  Hostname:
    Type: String
    Description: Service hostname
    Default: internal-specs.wyze.com
  DeletionProtection:
    Type: String
    Description: Disable only during deliberate service retirement
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AllowedCidr1:
    Type: String
    Description: Approved company VPN or office egress
    Default: 44.231.159.184/32
    AllowedPattern: ^(?:\d{1,3}\.){3}\d{1,3}/32$
  AllowedCidr2:
    Type: String
    Description: Approved company VPN or office egress
    Default: 54.189.112.236/32
    AllowedPattern: ^(?:\d{1,3}\.){3}\d{1,3}/32$
  AllowedCidr3:
    Type: String
    Description: Approved company VPN or office egress
    Default: 54.70.14.31/32
    AllowedPattern: ^(?:\d{1,3}\.){3}\d{1,3}/32$
  AllowedCidr4:
    Type: String
    Description: Approved company VPN or office egress
    Default: 44.227.197.192/32
    AllowedPattern: ^(?:\d{1,3}\.){3}\d{1,3}/32$
  AllowedCidr5:
    Type: String
    Description: Approved company VPN or office egress
    Default: 54.203.76.26/32
    AllowedPattern: ^(?:\d{1,3}\.){3}\d{1,3}/32$
  AllowedCidr6:
    Type: String
    Description: Approved company VPN or office egress
    Default: 4.53.144.62/32
    AllowedPattern: ^(?:\d{1,3}\.){3}\d{1,3}/32$
Resources:
  EncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Internal Specs runtime secret, application logs, and images
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIAM
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: EncryptServiceLogs
            Effect: Allow
            Principal:
              Service:
                Fn::Sub: logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/internal-specs
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
  EncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/internal-specs/prod
      TargetKeyId:
        Ref: EncryptionKey
  AccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: internal-specs-alb-logs-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: AccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DeliverALBLogs
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource:
              Fn::Sub: ${AccessLogBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*
            Condition:
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/wyze-internal-specs/*
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt:
                  - AccessLogBucket
                  - Arn
              - Fn::Sub: ${AccessLogBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: internal-specs
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey:
          Fn::GetAtt:
            - EncryptionKey
            - Arn
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /internal-specs/prod/runtime
      Description: Populate securely before deploying the service; JSON keys are documented in the runbook.
      KmsKeyId:
        Fn::GetAtt:
          - EncryptionKey
          - Arn
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/internal-specs
      RetentionInDays: 30
      KmsKeyId:
        Fn::GetAtt:
          - EncryptionKey
          - Arn
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal Specs HTTPS from approved company egress
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Ref: AllowedCidr1
          Description: US company VPN HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Ref: AllowedCidr2
          Description: US company VPN HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Ref: AllowedCidr3
          Description: US company VPN HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Ref: AllowedCidr4
          Description: US company VPN HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Ref: AllowedCidr5
          Description: US company VPN HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Ref: AllowedCidr6
          Description: US office HTTPS
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          DestinationSecurityGroupId:
            Ref: TaskSecurityGroup
          Description: Application and health checks to the service tasks
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal Specs tasks accept only their ALB
      VpcId:
        Ref: VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to GitHub, Glean, JumpCloud and AWS through existing NAT
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AccessLogBucketPolicy
    Properties:
      Name: wyze-internal-specs
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        Ref: PublicSubnets
      SecurityGroups:
        - Ref: AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value:
            Ref: DeletionProtection
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value:
            Ref: AccessLogBucket
        - Key: access_logs.s3.prefix
          Value: alb
        - Key: idle_timeout.timeout_seconds
          Value: '180'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: internal-specs
      VpcId:
        Ref: VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /api/healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '120'
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn:
            Ref: CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: Not found
  HostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: HttpsListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - Ref: Hostname
      Actions:
        - Type: forward
          TargetGroupArn:
            Ref: TargetGroup
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InternalSpecsExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  Fn::GetAtt:
                    - Repository
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - LogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  Ref: RuntimeSecret
              - Effect: Allow
                Action: kms:Decrypt
                Resource:
                  Fn::GetAtt:
                    - EncryptionKey
                    - Arn
                Condition:
                  StringEquals:
                    kms:ViaService:
                      Fn::Sub: secretsmanager.${AWS::Region}.amazonaws.com
                    kms:EncryptionContext:SecretARN:
                      Ref: RuntimeSecret
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Service
          Value: internal-specs
        - Key: Owner
          Value:
            Ref: OwnerEmail
  TaskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId:
        Ref: AlbSecurityGroup
      Description: Application and health-check traffic from the service ALB
Outputs:
  EncryptionKeyArn:
    Value:
      Fn::GetAtt:
        - EncryptionKey
        - Arn
  AccessLogBucketName:
    Value:
      Ref: AccessLogBucket
  RepositoryUri:
    Value:
      Fn::GetAtt:
        - Repository
        - RepositoryUri
  RuntimeSecretArn:
    Value:
      Ref: RuntimeSecret
  ExecutionRoleArn:
    Value:
      Fn::GetAtt:
        - ExecutionRole
        - Arn
  TaskRoleArn:
    Value:
      Fn::GetAtt:
        - TaskRole
        - Arn
  TaskSecurityGroupId:
    Value:
      Ref: TaskSecurityGroup
  TargetGroupArn:
    Value:
      Ref: TargetGroup
  TargetGroupFullName:
    Value:
      Fn::GetAtt:
        - TargetGroup
        - TargetGroupFullName
  AlbArn:
    Value:
      Ref: LoadBalancer
  AlbFullName:
    Value:
      Fn::GetAtt:
        - LoadBalancer
        - LoadBalancerFullName
  AlbDnsName:
    Value:
      Fn::GetAtt:
        - LoadBalancer
        - DNSName
  LogGroupName:
    Value:
      Ref: LogGroup
